# ScreenSpot evaluation config
dataset:
  path: "./data/screenspot"
  splits: ["mobile", "desktop", "web"]
  img_size: [1280, 720]

model:
  name: "Qwen2.5-VL-7B-Instruct"
  device: "cuda"
  temperature: 0.0
  max_new_tokens: 256

viewport:
  width: 1280
  height: 720

metrics:
  - click_accuracy
  - mean_distance_error
  - mean_normalized_distance

output:
  dir: "./experiments/screenspot/"
  save_visualizations: true
  num_qualitative_examples: 15

random:
  seed: 42
